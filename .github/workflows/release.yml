name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$APP_VERSION" || (echo "Tag $RELEASE_TAG must match package version $APP_VERSION" && exit 1)
      - run: npm ci
      - name: Build macOS download
        run: npm run release
        env:
          # Publish an unsigned download unless signing is configured deliberately.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish one public release with downloads and update metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=(artifacts/Aster-"$VERSION"-*.dmg artifacts/Aster-"$VERSION"-*.dmg.blockmap artifacts/Aster-"$VERSION"-*.zip artifacts/Aster-"$VERSION"-*.zip.blockmap artifacts/latest-mac.yml)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Aster $VERSION" \
            --notes-file .github/release-notes.md \
            --verify-tag \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
