<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfb"/>
      <stop offset="1" stop-color="#eef3f1"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9" fill="none" stroke="#66868a" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="820" height="560" fill="url(#paper)"/>
  <path d="M0 183H820M0 506H820" stroke="#dbe5e2" stroke-width="1"/>
  <circle cx="72" cy="64" r="5" fill="#c4a96b"/>
  <circle cx="72" cy="64" r="11" fill="none" stroke="#c4a96b" stroke-opacity=".24"/>
  <text x="96" y="69" fill="#52777b" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12" letter-spacing=".5">ASTER · FIRST LAUNCH</text>
  <text x="72" y="122" fill="#20343a" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="29" font-weight="500" letter-spacing="-.7">Move Aster to your Desktop</text>
  <text x="72" y="153" fill="#687b7d" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="15">Then run the helper on the right.</text>

  <circle cx="104" cy="226" r="15" fill="#e8f0ee"/>
  <text x="104" y="231" text-anchor="middle" fill="#476c71" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="13" font-weight="600">1</text>
  <text x="130" y="231" fill="#415b60" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="14">Drag Aster out of this window onto your Desktop</text>
  <path d="M246 365H566" fill="none" stroke="#66868a" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrowhead)"/>
  <text x="406" y="352" text-anchor="middle" fill="#87989a" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="10" letter-spacing="1">MOVE FIRST</text>

  <circle cx="104" cy="456" r="15" fill="#eeeaf8"/>
  <text x="104" y="461" text-anchor="middle" fill="#645b91" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="13" font-weight="600">2</text>
  <text x="130" y="461" fill="#415b60" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="14">Run the helper. It checks ~/Desktop/Aster.app.</text>

  <text x="72" y="544" fill="#7d8d8e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12">The helper changes only that Aster app, after you confirm.</text>
  <text x="748" y="572" text-anchor="end" fill="#8a9a9b" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="10">Aster for macOS</text>
</svg>
