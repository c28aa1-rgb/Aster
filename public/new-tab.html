<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>New tab</title>
    <link rel="stylesheet" href="./new-tab.css" />
    <script defer src="./new-tab.js"></script>
  </head>
  <body>
    <div class="celestial-art" aria-hidden="true"></div>
    <div class="page">
      <header class="page-header">
        <div class="wordmark" aria-label="Aster">
          <svg class="aster-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1c1.6 10.7 4.3 13.4 15 15-10.7 1.6-13.4 4.3-15 15C14.4 20.3 11.7 17.6 1 16 11.7 14.4 14.4 11.7 16 1Z" fill="currentColor"/></svg>
          <span>Aster</span>
        </div>
        <div class="today"><time id="date"></time><time id="clock"></time></div>
      </header>
      <main class="launchpad">
        <h1>Where next?</h1>
        <form id="search" class="search-field" action="https://www.google.com/search" method="get" role="search">
          <svg class="search-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="query" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search the web" aria-label="Search the web" required />
          <span id="search-control"><button class="search-submit" type="submit" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></span>
        </form>
        <nav id="shortcuts" class="shortcuts" aria-label="Shortcuts">
          <a class="shortcut" href="https://mail.google.com/"><span class="shortcut-icon">M</span><span>Gmail</span></a>
          <a class="shortcut" href="https://www.youtube.com/"><span class="shortcut-icon">Y</span><span>YouTube</span></a>
          <a class="shortcut" href="https://www.wikipedia.org/"><span class="shortcut-icon">W</span><span>Wikipedia</span></a>
          <a class="shortcut" href="https://github.com/"><span class="shortcut-icon">G</span><span>GitHub</span></a>
        </nav>
        <p class="search-provider">Search with Google</p>
      </main>
      <footer class="page-footer">
        <div class="keyboard-hints" aria-label="Keyboard shortcuts">
          <span><kbd>⌘ L</kbd> Address bar</span>
          <span><kbd>⌘ T</kbd> New tab</span>
        </div>
        <span class="art-title">Lunar Daybreak</span>
      </footer>
    </div>
  </body>
</html>
