<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New tab</title>
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("./fonts/InstrumentSans-Regular.ttf") format("truetype"); font-display: swap; }
      @font-face { font-family: "Instrument Serif"; src: url("./fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-display: swap; }
      :root { color-scheme: light; font-family: "Instrument Sans", "Helvetica Neue", sans-serif; color: #1c3038; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #1c3038; background: #f1f5f3 url("./assets/orbital-dawn.jpg") center right / cover no-repeat; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(241,245,243,.26), rgba(241,245,243,.12) 36%, transparent 70%); }
      main { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: clamp(52px, 7vw, 112px); }
      .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; color: #51777b; font-size: 12px; letter-spacing: .015em; }
      .mark::before { content: ""; width: 8px; height: 8px; border: 1px solid #8b7952; border-radius: 50%; background: #c4a96b; box-shadow: 0 0 0 4px rgba(196,169,107,.12); }
      h1 { max-width: 560px; margin: 0; font-family: "Instrument Serif", Georgia, serif; font-size: clamp(48px, 7vw, 88px); font-weight: 400; line-height: .98; letter-spacing: -.035em; }
      .time { margin: 18px 0 0; color: #667a7d; font-size: 14px; }
      form { width: min(500px, 78vw); height: 52px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-top: 40px; padding: 0 8px 0 18px; border: 1px solid rgba(52,90,94,.2); border-radius: 13px; background: rgba(255,255,255,.88); box-shadow: 0 8px 24px rgba(28,48,56,.07), inset 0 1px 0 #fff; backdrop-filter: blur(16px); }
      form:focus-within { border-color: #4e7b7e; box-shadow: 0 0 0 3px rgba(73,124,125,.12), 0 8px 24px rgba(28,48,56,.06); }
      input { width: 100%; border: 0; outline: 0; color: #1c3038; background: transparent; font: inherit; font-size: 14px; }
      input::placeholder { color: #849597; }
      button { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #315c61; border-radius: 9px; color: #fff; background: #35616a; font-size: 18px; cursor: pointer; transition: transform 120ms ease, background 120ms ease; }
      button:hover { background: #294f55; }
      button:active { transform: scale(.95); }
      button:focus-visible { outline: 2px solid #35616a; outline-offset: 3px; }
      .note { position: absolute; left: clamp(52px, 7vw, 112px); bottom: 34px; margin: 0; color: #6b8082; font-size: 11px; }
      @media (prefers-reduced-motion: no-preference) { main { animation: reveal 520ms cubic-bezier(.2,0,0,1) both; } @keyframes reveal { from { opacity: 0; transform: translateY(8px); } } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Aster observatory</div>
      <h1>Where next?</h1>
      <p class="time" id="time"></p>
      <form id="search">
        <input id="query" autocomplete="off" placeholder="Search the web" aria-label="Search the web" />
        <button type="submit" aria-label="Search">↗</button>
      </form>
      <p class="note">Your extensions are ready in every tab.</p>
    </main>
    <script>
      const clock = document.getElementById("time");
      clock.textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date());
      document.getElementById("search").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = document.getElementById("query").value.trim();
        if (value) location.href = `https://www.google.com/search?q=${encodeURIComponent(value)}`;
      });
    </script>
  </body>
</html>
